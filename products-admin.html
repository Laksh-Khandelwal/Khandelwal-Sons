<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Product Manager | Khandelwal &amp; Sons Admin</title>
  <link rel="icon" href="images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap">
  <link rel="stylesheet" href="style.css?v=12">
  <style>
    .pm-main { max-width: 1100px; margin: 0 auto; padding: 104px 20px 80px; }
    .pm-head { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between; margin-bottom: 24px; }
    .pm-head h1 { font-size: 1.8rem; color: var(--text-primary); margin: 0; }
    .pm-head p { color: var(--text-muted); margin: 4px 0 0; font-size: 0.9rem; }
    .pm-tools { display: flex; gap: 10px; flex-wrap: wrap; }
    .pm-search { padding: 10px 16px; border: 1px solid var(--border-light); border-radius: var(--radius-full); background: var(--bg-secondary); color: var(--text-primary); min-width: 200px; }
    .pm-btn { border: none; cursor: pointer; padding: 10px 18px; border-radius: var(--radius-full); font-weight: 600; font-size: 0.9rem; }
    .pm-btn-primary { background: var(--accent-gold); color: #fff; }
    .pm-btn-primary:hover { background: var(--accent-gold-hover); }
    .pm-btn-ghost { background: transparent; border: 1px solid var(--border-light); color: var(--text-primary); }
    .pm-btn-danger { background: transparent; border: 1px solid var(--accent-red); color: var(--accent-red); }
    .pm-count { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 12px; }
    .pm-list { display: flex; flex-direction: column; gap: 10px; }
    .pm-row { display: grid; grid-template-columns: 56px 1fr auto; gap: 14px; align-items: center; background: var(--bg-secondary); border: 1px solid var(--border-light); border-radius: var(--radius-md); padding: 12px 16px; }
    .pm-row img { width: 56px; height: 56px; object-fit: cover; border-radius: var(--radius-sm); background: #f0ece6; }
    .pm-row .pm-name { font-weight: 600; color: var(--text-primary); }
    .pm-row .pm-meta { font-size: 0.8rem; color: var(--text-muted); margin-top: 3px; }
    .pm-badge { display: inline-block; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.04em; background: rgba(197,168,128,0.18); color: var(--accent-gold-hover); padding: 2px 8px; border-radius: var(--radius-full); margin-right: 6px; }
    .pm-row-actions { display: flex; gap: 8px; }
    .pm-row-actions button { padding: 7px 14px; font-size: 0.82rem; border-radius: var(--radius-full); cursor: pointer; }
    .pm-empty { text-align: center; padding: 60px 20px; color: var(--text-muted); }

    .pm-modal { position: fixed; inset: 0; background: rgba(43,37,32,0.5); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 1000; }
    .pm-modal.show { display: flex; }
    .pm-modal-card { background: var(--bg-secondary); border-radius: var(--radius-lg); width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; padding: 28px; }
    .pm-modal-card h2 { margin: 0 0 18px; color: var(--text-primary); font-size: 1.3rem; }
    .pm-field { margin-bottom: 16px; }
    .pm-field label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-primary); margin-bottom: 6px; }
    .pm-field input, .pm-field select { width: 100%; padding: 10px 14px; border: 1px solid var(--border-light); border-radius: var(--radius-sm); background: var(--bg-primary); color: var(--text-primary); font-size: 0.9rem; }
    .pm-variants { display: flex; flex-direction: column; gap: 8px; }
    .pm-variant-row { display: grid; grid-template-columns: 1.4fr 1fr 1fr 32px; gap: 8px; align-items: center; }
    .pm-variant-row input { padding: 8px 10px; font-size: 0.85rem; }
    .pm-variant-row .pm-vrm { background: transparent; border: none; color: var(--accent-red); font-size: 1.1rem; cursor: pointer; }
    .pm-variant-head { display: grid; grid-template-columns: 1.4fr 1fr 1fr 32px; gap: 8px; font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .pm-add-variant { margin-top: 8px; background: transparent; border: 1px dashed var(--border-light); color: var(--accent-gold-hover); padding: 8px; border-radius: var(--radius-sm); cursor: pointer; font-size: 0.85rem; width: 100%; }
    .pm-modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 22px; }
    .pm-img-preview { width: 48px; height: 48px; object-fit: cover; border-radius: var(--radius-sm); margin-top: 8px; background: #f0ece6; display: none; }
  </style>
</head>
<body>

  <!-- Owner password gate -->
  <div id="admin-auth-overlay" class="modal-overlay" style="opacity: 1; visibility: visible; display: flex; background: var(--bg-primary); position: fixed; inset: 0; align-items: center; justify-content: center; z-index: 2000;">
    <div class="modal-card" style="background: var(--bg-secondary); padding: 32px; border-radius: var(--radius-lg); max-width: 380px; width: 100%; text-align: center;">
      <h2 style="color: var(--text-primary); margin-bottom: 6px;">Product Manager</h2>
      <p style="color: var(--text-muted); font-size: 0.88rem; margin-bottom: 18px;">Enter the owner password to continue.</p>
      <form id="admin-auth-form">
        <input type="password" id="admin-password" placeholder="Owner password" required
               style="width: 100%; padding: 12px 14px; border: 1px solid var(--border-light); border-radius: var(--radius-sm); text-align: center; margin-bottom: 12px;">
        <button type="submit" class="pm-btn pm-btn-primary" style="width: 100%;">Unlock</button>
      </form>
    </div>
  </div>

  <!-- Navbar -->
  <header class="navbar">
    <div class="container navbar-container">
      <a href="index.html" class="logo" id="owner-logo">
        <div class="logo-icon"><img src="images/logo.png" alt="Khandelwal &amp; Sons logo"></div>
        Khandelwal<span>&amp;Sons</span>
      </a>
      <nav class="nav-links">
        <a href="index.html" class="nav-link">Storefront</a>
        <a href="owner.html" class="nav-link">Orders Console</a>
        <a href="products-admin.html" class="nav-link active">Products</a>
        <a href="order-history.html" class="nav-link">Order History</a>
      </nav>
      <div class="nav-actions">
        <button id="btn-admin-logout" class="btn-secondary" style="padding: 8px 16px; font-size: 0.85rem; border-radius: var(--radius-full);">Log Out</button>
      </div>
    </div>
  </header>

  <main class="pm-main">
    <div class="pm-head">
      <div>
        <h1>Product Manager</h1>
        <p>Add, edit and remove products. Changes go live instantly — no redeploy needed.</p>
      </div>
      <div class="pm-tools">
        <input type="text" id="pm-search" class="pm-search" placeholder="Search products…" aria-label="Search products">
        <button id="pm-add-btn" class="pm-btn pm-btn-primary">＋ Add Product</button>
      </div>
    </div>

    <div class="pm-count" id="pm-count"></div>
    <div class="pm-list" id="pm-list">
      <div class="pm-empty">Loading products…</div>
    </div>
  </main>

  <!-- Add / Edit modal -->
  <div class="pm-modal" id="pm-modal">
    <div class="pm-modal-card">
      <h2 id="pm-modal-title">Add Product</h2>
      <form id="pm-form">
        <input type="hidden" id="pm-id">
        <div class="pm-field">
          <label for="pm-name">Product name</label>
          <input type="text" id="pm-name" required placeholder="e.g. Amul Butter">
        </div>
        <div class="pm-field">
          <label for="pm-category">Category</label>
          <select id="pm-category" required></select>
        </div>
        <div class="pm-field">
          <label for="pm-image">Product image</label>
          <input type="text" id="pm-image" placeholder="Upload below, or paste an image URL / path">
          <div style="display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; align-items:center;">
            <label class="pm-btn pm-btn-ghost" style="cursor:pointer; margin:0;">📁 Upload from device
              <input type="file" id="pm-file" accept="image/*" style="display:none;">
            </label>
            <label class="pm-btn pm-btn-ghost" style="cursor:pointer; margin:0;">📷 Take photo
              <input type="file" id="pm-camera" accept="image/*" capture="environment" style="display:none;">
            </label>
            <span id="pm-upload-status" style="font-size:0.8rem; color:var(--text-muted);"></span>
          </div>
          <img id="pm-img-preview" class="pm-img-preview" alt="preview">
        </div>
        <div class="pm-field">
          <label>Highlights (show in storefront rows)</label>
          <label style="display:inline-flex; align-items:center; gap:8px; margin-right:20px; font-weight:500; cursor:pointer;">
            <input type="checkbox" id="pm-tag-bestseller"> ⭐ Best Seller
          </label>
          <label style="display:inline-flex; align-items:center; gap:8px; font-weight:500; cursor:pointer;">
            <input type="checkbox" id="pm-tag-frequent"> 🔁 Frequently Ordered
          </label>
        </div>
        <div class="pm-field">
          <label>Sizes &amp; pricing</label>
          <div class="pm-variant-head">
            <span>Size</span><span>Price (₹)</span><span>Stock</span><span></span>
          </div>
          <div class="pm-variants" id="pm-variants"></div>
          <button type="button" class="pm-add-variant" id="pm-add-variant">＋ Add another size</button>
        </div>
        <div class="pm-modal-actions">
          <button type="button" class="pm-btn pm-btn-ghost" id="pm-cancel">Cancel</button>
          <button type="submit" class="pm-btn pm-btn-primary" id="pm-save">Save Product</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast-notification">
    <div class="toast-content"><span class="toast-icon">✨</span><span class="toast-text"></span></div>
  </div>

  <script src="products-admin.js?v=1"></script>
</body>
</html>
